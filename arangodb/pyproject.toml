[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy-arangodb"
version = "0.1.0"
description = "ArangoDB adapter for merapy — NoSQL/graph repository support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimas Santoso" }]
keywords = ["merapy", "merapy-plugin", "arangodb", "nosql", "graph"]
dependencies = [
    "merapy>=0.1.0",
    "python-arango>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["merapy_arangodb*"]
