[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy-sanic-rest"
version = "0.1.0"
description = "Sanic adapter for merapy RESTRouter — alternative to the built-in FastAPI / Litestar adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimas Santoso" }]
keywords = ["merapy", "merapy-plugin", "sanic", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "merapy>=0.1.0",
    "sanic>=24.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["merapy_sanic_rest*"]
