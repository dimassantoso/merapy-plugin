[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy-blacksheep-rest"
version = "0.1.0"
description = "BlackSheep adapter for merapy RESTRouter — alternative to FastAPI / Litestar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimas Santoso" }]
keywords = ["merapy", "merapy-plugin", "blacksheep", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "merapy>=0.1.0",
    "blacksheep>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["merapy_blacksheep_rest*"]
