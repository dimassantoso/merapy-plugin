[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kapynis-stomp-broker"
version = "0.1.0"
description = "STOMP protocol broker + worker for kapynis (ActiveMQ, RabbitMQ STOMP plugin, etc.)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimas Santoso" }]
keywords = ["kapynis", "kapynis-plugin", "stomp", "activemq"]
dependencies = [
    "kapynis>=0.1.0",
    "aiostomp>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["merapy_stomp*"]
