[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy-p2p"
version = "0.1.0"
description = "libp2p-backed peer-to-peer AppServerFactory for merapy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimas Santoso" }]
keywords = ["merapy", "merapy-plugin", "p2p", "libp2p"]
dependencies = [
    "merapy>=0.1.0",
    "libp2p>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["merapy_p2p*"]
