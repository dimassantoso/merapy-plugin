[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy-aws-sqs-sns"
version = "0.1.0"
description = "AWS SQS (broker + worker) and SNS (publisher) for merapy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dimas Santoso" }]
keywords = ["merapy", "merapy-plugin", "aws", "sqs", "sns"]
dependencies = [
    "merapy>=0.1.0",
    "aioboto3>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["merapy_aws_sqs*"]
